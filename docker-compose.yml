services:
  eureka-server:
    build: ./infra/discovery-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ./infra
      dockerfile: config-server/Dockerfile
    container_name: config-server
    depends_on:
      eureka-server:
        condition: service_healthy
    volumes:
      - ./infra/config-repo:/app/config-repo
    environment:
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"
      SPRING_APPLICATION_NAME: "config-server"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/app/config-repo,file:/app/config-repo/core,file:/app/config-repo/statistics-service,file:/app/config-repo/infra"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://eureka-server:8761/eureka/apps/CONFIG-SERVER" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-server:
    build: ./infra/gateway-server
    container_name: gateway-server
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      SPRING_APPLICATION_NAME: "gateway-server"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      eureka.instance.prefer-ip-address: "true"

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      POSTGRES_DB: ewm-stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-server:
    build: ./statistics-service/statistics-service-server
    container_name: stats-server
    depends_on:
      stats-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://stats-db:5432/ewm-stats"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_APPLICATION_NAME: "stats-server"
      SPRING_CLOUD_CONFIG_NAME: "stats-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  ewm-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ewm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  event-service:
    build: ./core/main-service/event-service
    container_name: event-service
    depends_on:
      ewm-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_CONFIG_IMPORT: "configserver:"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: "event-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"

  management-participation:
    build: ./core/main-service/management-participation
    container_name: management-participation
    depends_on:
      ewm-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_CONFIG_IMPORT: "configserver:"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: "management-participation"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"

  user-service:
    build: ./core/main-service/user-service
    container_name: user-service
    depends_on:
      ewm-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_CONFIG_IMPORT: "configserver:"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: "user-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"

  comments-service:
    build: ./core/main-service/comments-service
    container_name: comments-service
    depends_on:
      ewm-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_CONFIG_IMPORT: "configserver:"
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APPLICATION_NAME: "comments-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      eureka.instance.prefer-ip-address: "true"

volumes:
  stats-db-data:
  ewm-db-data: