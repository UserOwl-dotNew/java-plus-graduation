services:
  eureka-server:
    build: ./infra/discovery-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ./infra
      dockerfile: config-server/Dockerfile
    container_name: config-server
    depends_on:
      eureka-server:
        condition: service_healthy
    volumes:
      - ./infra/config-repo:/app/config-repo
    environment:
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
      SPRING_APPLICATION_NAME: "config-server"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://eureka-server:8761/eureka/apps/CONFIG-SERVER" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      POSTGRES_DB: ewm-stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-server:
    build: ./statistics-service/statistics-service-server
    container_name: stats-server
    depends_on:
      stats-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://stats-db:5432/ewm-stats"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_APPLICATION_NAME: "stats-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"

  ewm-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ewm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ewm-service:
    build: ./core/main-service
    container_name: ewm-service
    depends_on:
      ewm-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_CONFIG_DISCOVERY_SERVICE_ID: "config-server"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_APPLICATION_NAME: "main-service"
      eureka.client.serviceUrl.defaultZone: "http://eureka-server:8761/eureka/"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  stats-db-data:
  ewm-db-data: