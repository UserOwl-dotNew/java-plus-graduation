server:
  port: 8080
spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: ewm-service
              uri: lb://ewm-service
              predicates:
                - Path=/admin/**,/users/**,/categories/**,/compilations/**,/events/**,/comments/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/