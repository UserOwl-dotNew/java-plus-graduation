server:
  port: 0

spring:
  application:
    name: stats-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ewm
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect