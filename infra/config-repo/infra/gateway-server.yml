server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: management-participation
              uri: lb://management-participation
              predicates:
                - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests
            - id: comments-service
              uri: lb://comments-service
              predicates:
                - Path=/admin/comments/**,/users/{userId}/comments/**,/events/{eventId}/comments/**
            - id: event-management
              uri: lb://event-management
              predicates:
                - Path=/admin/categories/**,/categories/**,/admin/compilations/**,/compilations/**,/admin/events/**,/events/**,/users/**
            - id: user-administration
              uri: lb://user-administration
              predicates:
                - Path=/admin/users/**
          discovery:
            locator:
              enabled: true