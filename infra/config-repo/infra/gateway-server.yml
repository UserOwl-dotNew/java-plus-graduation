server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: request-service
              uri: lb://request-service
              predicates:
                - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests
            - id: comment-service
              uri: lb://comment-service
              predicates:
                - Path=/admin/comments/**,/users/{userId}/comments/**,/events/{eventId}/comments/**
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/admin/categories/**,/categories/**,/admin/compilations/**,/compilations/**,/admin/events/**,/events/**,/users/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/admin/users/**
            - id: stats-server
              uri: lb://stats-server
              predicates:
                - Path=/hit,/stats
          discovery:
            locator:
              enabled: true