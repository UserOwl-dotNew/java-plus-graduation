spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/ewm
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      jdbc:
        lob:
          non_contextual_creation: true
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health